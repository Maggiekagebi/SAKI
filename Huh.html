<!doctype html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Huh?</title>
		<!-- 引入外部CSS文件 -->
		<link rel="stylesheet" href="css/all.css" />
		<link rel="stylesheet" href="css/style.css" />
		<link rel="stylesheet" href="css/media.css" />
		<!-- 引入字體圖標 -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
			integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer" />
		<!-- 引入Google字體 -->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" />
		<!-- 引入Vue.js (官方CDN) -->
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	</head>
	<body>
		<!-- Vue應用容器 -->
		<div id="app">
			<!-- 背景元素 -->
			<div class="background-elements">
				<div class="circle circle1"></div>
				<div class="circle circle2"></div>
				<div class="circle circle3"></div>
				<div class="floating-shape flower1"></div>
				<div class="floating-shape flower2"></div>
				<div class="floating-shape leaf1"></div>
				<div class="floating-shape leaf2"></div>
			</div>

			<div class="header-container">
				<!-- 頁頭導航區域 -->
				<header>
					<div class="logo">
						<a href="index.html" title="回到首頁">
							<img
								src="images/Logo Design/Logo.svg"
								alt="Saki Logo"
								class="logo-svg" />
						</a>
					</div>

					<div class="hamburger-menu" @click="toggleMenu">
						<div class="bar" :class="{ 'animate': menuOpen }"></div>
						<div class="bar" :class="{ 'animate': menuOpen }"></div>
						<div class="bar" :class="{ 'animate': menuOpen }"></div>
					</div>

					<nav :class="{ 'mobile-open': menuOpen }">
						<ul>
							<li
								v-for="item in navItems"
								:key="item.id"
								:class="{ 'has-dropdown': item.dropdown }">
								<a
									:href="item.link"
									:class="{ active: currentPage === item.id }"
									@click="item.dropdown ? toggleDropdown($event, item.id) : closeMenu()">
									{{ item.text }}
									<i
										v-if="item.dropdown"
										class="fas fa-chevron-down dropdown-icon"
										@click.stop="toggleDropdown($event, item.id)"></i>
								</a>

								<ul
									v-if="item.dropdown"
									class="dropdown-menu"
									:class="{ 'show': activeDropdown === item.id }">
									<li v-for="child in item.dropdownItems" :key="child.id">
										<a
											:href="child.link"
											:class="{ active: currentPage === child.id }"
											@click="closeMenu">
											{{ child.text }}
										</a>
									</li>
								</ul>
							</li>
						</ul>
					</nav>
				</header>
			</div>

			<!-- 主要內容區域 -->
			<main class="about-container">
				<!-- 頁面標題 -->
				<div class="page-title">
					<h2><span class="emoji">🎨</span></h2>
					<p>記錄生活瞬間</p>
				</div>

				<!-- 作品集過濾器 -->
				<div class="portfolio-filters">
					<button
						class="filter-btn"
						:class="{ active: activeFilter === 'all' }"
						@click="filterProjects('all')">
						全部作品
					</button>
					<button
						v-for="category in uniqueCategories"
						:key="category"
						class="filter-btn"
						:class="{ active: activeFilter === category }"
						@click="filterProjects(category)">
						{{ category }}
					</button>
				</div>

				<div class="portfolio-grid" v-if="filteredProjects.length > 0">
					<div
						v-for="project in filteredProjects"
						:key="project.id"
						class="portfolio-item">
						<div class="portfolio-image">
							<img :src="project.image" :alt="project.title" />
							<div class="portfolio-overlay">
								<div class="project-category">{{ project.category }}</div>
								<h3>{{ project.title }}</h3>
								<a
									href="#"
									class="view-details"
									@click.prevent="viewProjectDetails(project)"
									>查看詳情</a
								>
							</div>
						</div>
					</div>
				</div>

				<div class="no-content" v-else>
					<p>目前還沒有任何作品喔！</p>
				</div>

				<div class="project-modal" v-if="showModal" @click="closeModal">
					<div class="modal-content" @click.stop>
						<span class="close-modal" @click="closeModal">&times;</span>
						<div class="modal-image">
							<template
								v-if="selectedProject.images && selectedProject.images.length > 1">
								<button class="carousel-btn prev" @click.stop="prevImage">
									<i class="fas fa-chevron-left"></i>
								</button>

								<img
									:src="selectedProject.images[currentImageIndex]"
									:alt="selectedProject.title" />

								<button class="carousel-btn next" @click.stop="nextImage">
									<i class="fas fa-chevron-right"></i>
								</button>

								<div class="carousel-counter">
									{{ currentImageIndex + 1 }} / {{ selectedProject.images.length }}
								</div>
							</template>

							<template
								v-else-if="selectedProject.image || (selectedProject.images && selectedProject.images.length === 1)">
								<img
									:src="selectedProject.images && selectedProject.images.length === 1 ? selectedProject.images[0] : selectedProject.image"
									:alt="selectedProject.title" />
							</template>
						</div>
						<div class="modal-info">
							<h3>{{ selectedProject.title }}</h3>
							<div class="modal-category">{{ selectedProject.category }}</div>
							<div
								style="
									white-space: pre-wrap;
									line-height: 1.8;
									color: #555;
									margin-top: 1rem;
								">
								{{ selectedProject.description }}
							</div>
						</div>
					</div>
				</div>
			</main>

			<!-- 頁尾區域 -->
			<footer>
				<p>
					&copy; {{ new Date().getFullYear() }} {{ personalInfo.name }}.
					保留所有權利。
				</p>
			</footer>
		</div>

		<!-- 引入外部JavaScript文件 -->
		<script src="js/huh-data.js"></script>
		<script src="js/Huh.js"></script>
	</body>
</html>
